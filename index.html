<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Pinch zoom is deliberately left enabled (M36): the scale lock this tag
      used to carry is a WCAG 1.4.4 failure, and it bit hardest here because
      some shell labels run as small as 8.5px. viewport-fit=cover stays — the
      safe-area insets in shell.css/page.css keep content clear of the notch.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#201711" />
    <meta name="description" content="Fieldwatch — a roguelite tower-defense autobattler." />
    <meta name="color-scheme" content="dark" />

    <!-- Installable web app (M24) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fieldwatch" />

    />
