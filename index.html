<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Loopward</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%234fa8e8' stroke-width='4'/%3E%3Ccircle cx='16' cy='4' r='3.5' fill='%23f2c14e'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-stat hud-gold">
        <span class="hud-icon gold-icon"></span>
        <span id="hud-gold">0</span>
      </div>

      <div class="hud-basehp">
        <div class="basehp-bar">
          <div id="hud-basehp-fill" class="basehp-fill"></div>
        </div>
        <span id="hud-basehp-text" class="basehp-text">0/0</span>
      </div>

      <div class="hud-tier">
        <span id="hud-tier-label">Ring I</span>
        <div class="tier-progress-track">
          <div id="tier-progress-fill" class="tier-progress-fill"></div>
        </div>
        <span id="tier-progress-label" class="tier-progress-label"></span>
      </div>

      <div class="hud-stat hud-cores">
        <span class="hud-icon cores-icon"></span>
        <span id="hud-cores">0</span>
      </div>
    </header>

    <main id="canvas-wrap">
      <canvas id="bg-canvas"></canvas>
      <canvas id="game-canvas"></canvas>

      <div id="tier-banner" class="tier-banner hidden">
        <span id="tier-banner-text"></span>
        <button id="expand-btn" class="action-btn expand-btn">Expand</button>
      </div>
    </main>

    <footer id="action-bar">
      <div class="panel-row">
        <span class="panel-label">Build</span>
        <div id="tower-buttons" class="button-row"></div>
      </div>
      <div class="panel-row">
        <span class="panel-label">Send</span>
        <div id="troop-buttons" class="button-row"></div>
        <button id="cashout-btn" class="action-btn cashout-btn">Cash Out</button>
      </div>
    </footer>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal-start" class="modal hidden">
      <h1>Loopward</h1>
      <p class="modal-sub">An idle loop tower defense.</p>
      <div class="cores-balance">
        <span class="hud-icon cores-icon"></span>
        <span id="start-cores">0</span> Cores
      </div>
      <button id="start-newrun-btn" class="action-btn primary">New Run</button>
      <button id="start-metashop-btn" class="action-btn">Meta Shop</button>
    </div>

    <div id="modal-upgrade" class="modal hidden">
      <h2>Choose an upgrade</h2>
      <p class="modal-sub">Applies for the rest of this run only.</p>
      <div id="upgrade-choices" class="upgrade-choices"></div>
    </div>

    <div id="modal-runend" class="modal hidden">
      <h2>Run Over</h2>
      <div id="runend-stats" class="runend-stats"></div>
      <div class="cores-balance">
        Cores earned: <strong><span id="runend-cores">0</span></strong>
      </div>
      <button id="runend-newrun-btn" class="action-btn primary">Start New Run</button>
      <button id="runend-metashop-btn" class="action-btn">Meta Shop</button>
    </div>

    <div id="modal-metashop" class="modal hidden">
      <h2>Meta Shop</h2>
      <div class="cores-balance">
        <span class="hud-icon cores-icon"></span>
        <span id="metashop-cores">0</span> Cores
      </div>
      <div id="metashop-list" class="metashop-list"></div>
      <button id="metashop-close-btn" class="action-btn">Close</button>
    </div>

    <div id="modal-offline" class="modal hidden">
      <h2>Welcome back</h2>
      <div id="offline-summary" class="offline-summary"></div>
      <button id="offline-dismiss-btn" class="action-btn primary">Continue</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
