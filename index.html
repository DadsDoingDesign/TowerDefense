<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Pinch zoom is deliberately left enabled (M36): the scale lock this tag
      used to carry is a WCAG 1.4.4 failure, and it bit hardest here because
      some shell labels run as small as 8.5px. viewport-fit=cover stays — the
      safe-area insets in shell.css/page.css keep content clear of the notch.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#201711" />
    <meta
      name="description"
      content="Hold the meadow against the goblin horde. A roguelite tower-defense autobattler: post your heroes, then watch the fight play out."
    />
    <meta name="color-scheme" content="dark" />

    <!-- Installable web app (M24) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fieldwatch" />

    <!-- The mark, drawn on the 16px grid (scripts/brand.ts). SVG first; the PNG is
         for browsers that do not take SVG favicons. -->
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />

    <!-- Link previews (Phase 4). The card is public/social/og-image.png, rendered
         by scripts/brand.ts. build/siteMeta.ts makes these URLs absolute when the
         site URL is known at build time (FW_SITE_URL, or Vercel's production URL). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fieldwatch" />
    <meta property="og:title" content="Fieldwatch — hold the meadow against the goblin horde" />
    <meta
      property="og:description"
      content="A roguelite tower-defense autobattler. Post your heroes along the road, then watch them hold the line."
    />
    <meta property="og:url" content="./" />
    <meta property="og:image" content="social/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Fieldwatch: pixel-art heroes guard a meadow road at dusk as a goblin column with torches approaches."
    />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fieldwatch — hold the meadow against the goblin horde" />
    <meta
      name="twitter:description"
      content="A roguelite tower-defense autobattler. Post your heroes along the road, then watch them hold the line."
    />
    <meta name="twitter:image" content="social/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Fieldwatch: pixel-art heroes guard a meadow road at dusk as a goblin column with torches approaches."
    />
    <title>Fieldwatch</title>

    <!-- The boot splash (Lane 4.3). The bundle is ~250 KB gzipped, so on a slow
         link the page used to stay empty for seconds. This paints with the first
         stylesheet instead, and React's createRoot replaces it with the first
         screen. The wordmark sits where the menu's does on a phone, so the menu
         grows around it. Static and self-contained: no requests of its own. -->
    <style>
      .fw-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 0;
        background: #201711;
        color: #f3e7d0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      /* The menu head's shade band, so the menu's map arrives under it. */
      .fw-splash::before {
        content: '';
        position: absolute;
        inset: 0 0 auto;
        height: calc(108px + env(safe-area-inset-top, 0px));
        background: linear-gradient(rgba(16, 12, 8, 0.86) 66%, rgba(16, 12, 8, 0));
      }
      .fw-splash-title {
        position: relative;
        margin: 0;
        font: 700 40px/1 'Crimson Text', Georgia, 'Times New Roman', serif;
        letter-spacing: 0.06em;
        color: #e0ac4c;
        text-shadow: 0 2px 0 rgba(20, 12, 6, 0.7), 0 0 18px rgba(20, 12, 6, 0.8);
      }
      .fw-splash-marks {
        position: absolute;
        top: 50%;
        left: 50%;
        display: flex;
        gap: 8px;
        transform: translate(-50%, -50%);
      }
      .fw-splash-marks i {
        width: 8px;
        height: 8px;
        background: #f0c46a;
        opacity: 0.25;
        animation: fw-splash-pulse 1.2s steps(2, jump-none) infinite;
      }
      .fw-splash-marks i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .fw-splash-marks i:nth-child(3) {
        animation-delay: 0.4s;
      }
      .fw-splash-late {
        position: absolute;
        top: calc(50% + 24px);
        left: 16px;
        right: 16px;
        margin: 0;
        font-size: 13px;
        line-height: 1.35;
        text-align: center;
        color: #d4c0a0;
        visibility: hidden;
        animation: fw-splash-late 0s 15s forwards;
      }
      @keyframes fw-splash-pulse {
        50% {
          opacity: 1;
        }
      }
      @keyframes fw-splash-late {
        to {
          visibility: visible;
        }
      }
      @media (max-width: 479.98px) {
        .fw-splash-title {
          font-size: 34px;
        }
      }
      @media (max-width: 389.98px) {
        .fw-splash {
          align-items: flex-start;
        }
        .fw-splash-title {
          font-size: 30px;
        }
      }
      @media (min-width: 900px) and (min-height: 540px) {
        .fw-splash {
          align-items: flex-start;
          padding: 36px 32px 0 33px;
        }
        .fw-splash::before {
          display: none;
        }
        .fw-splash-title {
          font-size: 52px;
        }
      }
      @media (orientation: portrait) and (max-height: 700px) {
        .fw-splash {
          padding-top: calc(12px + env(safe-area-inset-top, 0px));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fw-splash-marks i {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="fw-splash" role="status" aria-label="Loading Fieldwatch">
        <p class="fw-splash-title">Fieldwatch</p>
        <div class="fw-splash-marks" aria-hidden="true"><i></i><i></i><i></i></div>
        <span class="fw-splash-late">Still loading. A slow connection can take a little while.</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
