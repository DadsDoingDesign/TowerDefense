<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Pinch zoom is deliberately left enabled (M36): the scale lock this tag
      used to carry is a WCAG 1.4.4 failure, and it bit hardest here because
      some shell labels run as small as 8.5px. viewport-fit=cover stays — the
      safe-area insets in shell.css/page.css keep content clear of the notch.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#201711" />
    <meta
      name="description"
      content="Hold the meadow against the goblin horde. A roguelite tower-defense autobattler: post your heroes, then watch the fight play out."
    />
    <meta name="color-scheme" content="dark" />

    <!-- Installable web app (M24) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fieldwatch" />

    <!-- The mark, drawn on the 16px grid (scripts/brand.ts). SVG first; the PNG is
         for browsers that do not take SVG favicons. -->
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />

    <!-- Link previews (Phase 4). The card is public/social/og-image.png, rendered
         by scripts/brand.ts. build/siteMeta.ts makes these URLs absolute when the
         site URL is known at build time (FW_SITE_URL, or Vercel's production URL). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fieldwatch" />
    <meta property="og:title" content="Fieldwatch — hold the meadow against the goblin horde" />
    <meta
      property="og:description"
      content="A roguelite tower-defense autobattler. Post your heroes along the road, then watch them hold the line."
    />
    <meta property="og:url" content="./" />
    <meta property="og:image" content="social/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Fieldwatch: pixel-art heroes guard a meadow road at dusk as a goblin column with torches approaches."
    />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fieldwatch — hold the meadow against the goblin horde" />
    <meta
      name="twitter:description"
      content="A roguelite tower-defense autobattler. Post your heroes along the road, then watch them hold the line."
    />
    <meta name="twitter:image" content="social/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Fieldwatch: pixel-art heroes guard a meadow road at dusk as a goblin column with torches approaches."
    />
    <title>Fieldwatch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
