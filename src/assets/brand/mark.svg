  <title>Merchant Mercenaries</title>
  <!--
    The Merchant Mercenaries mark: the Dripping Seal. A red wax seal pressed on a contract,
    a gold coin at its heart and a sword in the wax — the pay, the blade and the bond.
    Geometry: the designer's “29 refined” (Figma › LOGO ONLY), drawn on a 240 grid, set here
    at 0.2 so it sits on the brand scripts' 48-unit grid. Construction, clear space and colour
    ways: docs/BRAND.md § Identity.

    Wax      the seal's rough edge in #b23a2c, the pressed ring r73.44 in #982f22, two drips.
    Coin     gold face r57.6 over a darker edge (a 4.6 drop), with an inner struck ring.
    Sword    in the ring's own red: pommel, grip and blade on the gold; only the crossguard's
             two arms run out past the coin and merge with the ring.
    Shine    one wet highlight, top left, and a dot on the long drip.
  -->
