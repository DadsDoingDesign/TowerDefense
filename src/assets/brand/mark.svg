<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Fieldwatch</title>
  <!--
    The Fieldwatch mark: the Watchtower on the meadow rim, against a dusk sun.
    48-unit grid. Construction, clear space and colour ways: docs/BRAND.md § Identity.

    Disc     circle c(24,24) r22.
    Horizon  quadratic (0,39.5) → ctrl (24,30.6) → (48,39.5); crest y35.05, meets the disc at x6.55 / 41.45.
    Tower    axis x23.5 (0.5 left of centre, balancing the pennant); body tapers 8.4 → 10.4 wide,
             eaves 13.2 wide at y20, apex y10.2, pole 1.3 wide to y5.
    Pennant  swallowtail, y5 → 8.8, tip x31.9, notch x29.5.
    Window   arched, 3 wide, y24 → 29.6 — the lamp: someone is on watch.

    Full colour: gold disc, cream lamp, teal pennant (the knights' colour). Transparent silhouette,
    so the tower and the hill are always the ground it sits on.
  -->
  <path fill="#e0ac4c" d="M6.55 37.4A22 22 0 1 1 41.45 37.4Q35.07 35.68 28.7 35.22L27.7 20H30.1L24.15 11.17V8.8H31.9L29.5 6.9L31.9 5H22.85V11.17L16.9 20H19.3L18.3 35.3Q12.43 35.82 6.55 37.4Z"/>
  <path fill="#fff1c8" d="M22 29.6V25.5A1.5 1.5 0 0 1 25 25.5V29.6Z"/>
  <path fill="#57a2b6" d="M24.15 5H31.9L29.5 6.9L31.9 8.8H24.15Z"/>
</svg>
