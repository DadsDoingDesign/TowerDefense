name: iOS

# Builds the iOS app on GitHub's Macs and sends it to TestFlight. Run it by hand
# (Actions → iOS → Run workflow): every run is a new TestFlight build, and macOS
# minutes are the expensive kind.
#
# Signing is Xcode's automatic, cloud-managed signing, driven by an App Store
# Connect API key — no certificates or profiles live in the repo. Repository
# secrets it needs (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      the API key's Key ID
#   ASC_ISSUER_ID   the Issuer ID shown above the keys list
#   ASC_KEY_P8      the full contents of the downloaded AuthKey_XXXX.p8
#   APPLE_TEAM_ID   the 10-character Team ID (developer.apple.com → Membership)
# The key needs the Admin role: creating the distribution certificate the first
# time requires it.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight (off = just prove it builds and signs)
        type: boolean
        default: true

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  testflight:
    name: Build, sign, upload
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
      ARCHIVE: ${{ runner.temp }}/Fieldwatch.xcarchive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Missing secrets — see the comment at the top of .github/workflows/ios.yml"
            exit 1
          fi
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"

      # The build number has to rise with every upload; the run number does.
      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export${{ inputs.upload && ' and upload to TestFlight' || '' }}
        run: |
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          cp ios/ExportOptions.plist "$OPTS"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$OPTS"
          if [ "${{ inputs.upload }}" != "true" ]; then
            plutil -replace destination -string export "$OPTS"
          fi
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" -exportOptionsPlist "$OPTS" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
