name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    # Pinned, not `ubuntu-latest`: the image moving under the project is a
    # change nobody reviewed. Bump it on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # `npm run build` minus its `tsc -b`, which the typecheck above has just
      # run: the generated-file checks (fw-icons:check, anchors:check), then the
      # bundle. `build:checks` is the same script `npm run build` starts with.
      - run: npm run build:checks
      - run: npx vite build
      # Sprite provenance (`npx tsx scripts/harvest-cc0.ts --check`) is a manual
      # check: it downloads the CC0 mirror through GitHub's unauthenticated,
      # rate-limited API, which would make this job flaky.

  balance:
    name: Balance invariants
    # 17–24 minutes on the hosted runner. Only when the simulation or its data can have moved.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Did the sim change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$base" HEAD | grep -qE '^(src/game/|src/state/|balance/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.run == 'true'
        run: npm ci
      # Gates on what it can hold today: the harness runs to completion (a throw
      # still fails the step) and the golden report below is current. The
      # tuning invariants are red on purpose until the tuning pass re-anchors
      # them, so BALANCE_INVARIANTS=warn reports each one as a ::warning:: and
      # lists them all in the job summary instead of failing the job
      # (balance/verdict.ts). Locally `npm run balance` still exits 1 on them.
      - if: steps.changed.outputs.run == 'true'
        name: Run the balance harness
        run: npm run balance
        env:
          BALANCE_INVARIANTS: warn
      # The report is deterministic, so the committed copy is a golden file:
      # a sim change must ship with its regenerated report.
      - if: steps.changed.outputs.run == 'true'
        name: Committed balance/REPORT.md is current
        run: |
          if ! git diff --exit-code balance/REPORT.md; then
            echo "::error file=balance/REPORT.md::balance/REPORT.md is stale. Run npm run balance and commit the regenerated report."
            exit 1
          fi
